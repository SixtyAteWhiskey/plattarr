name: Build image

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Restore backend dependencies with audit enabled
        run: >-
          dotnet restore src/Radarr.sln
          --property:NuGetAudit=true
          --property:NuGetAuditMode=all

      - name: Build and test backend
        run: ./tools/verify.sh

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Type-check frontend
        run: yarn typecheck

      - name: Lint frontend
        run: yarn lint

      - name: Lint frontend styles
        run: yarn stylelint-linux

      - name: Build production frontend
        run: yarn build --env production

      - name: Verify generated files are current
        run: |
          git diff --exit-code -- .
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git status --short
            exit 1
          fi

  build:
    if: github.event_name == 'pull_request'
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plattarr
          tags: |
            type=raw,value=develop,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLATTARR_VERSION=10.0.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    needs: validation
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plattarr
          tags: |
            type=raw,value=develop,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLATTARR_VERSION=10.0.0.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
