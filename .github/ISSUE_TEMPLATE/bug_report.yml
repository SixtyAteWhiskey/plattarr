name: Bug report
description: Report a reproducible problem in Plattarr
body:
  - type: checkboxes
    attributes:
      label: Existing reports
      options:
        - label: I searched the existing issues for this problem
          required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include version or image tag, deployment type, operating system, and database type.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove API keys, passwords, host addresses, and personal data before posting.
      render: text
    validations:
      required: false
