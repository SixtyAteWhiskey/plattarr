name: Feature request
description: Suggest an improvement to Plattarr
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other ways you could solve this?
    validations:
      required: false
