# Plattarr dev stack for SERVER01 (portable to the HP Elite Mini).
#
# Phase 0 safety rules:
#   - Port 7880 (Plattarr's default), so it doesn't collide with live Radarr
#     (7878) or gluetun's qBittorrent UI (8080) on SERVER01.
#   - Fresh ./config. Never point this at the live Radarr or Prowlarr config.
#   - /data is read-only until import testing starts in Phase 1.
#
# Fill in .env (copy .env.example) before running:
#   docker compose --env-file .env up -d

services:
  plattarr:
    image: ${PLATTARR_IMAGE:?set PLATTARR_IMAGE in .env}
    container_name: plattarr-dev
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UMASK=002
      - TZ=America/Denver
    volumes:
      - ./config:/config
      - ${DATA_PATH:?set DATA_PATH in .env}:/data:ro
    ports:
      - "7880:7880"
    restart: unless-stopped
